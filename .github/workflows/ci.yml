name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.428'

      - name: Select the .NET 6 SDK
        run: |
          echo '{"sdk":{"version":"6.0.428","rollForward":"disable"}}' > global.json
          dotnet --version

      - name: Restore
        run: dotnet restore backend/BrownEvents.sln

      - name: Build
        run: dotnet build backend/BrownEvents.sln --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test backend/BrownEvents.Tests/BrownEvents.Tests.csproj
          -c Release --no-build --no-restore
          --logger "console;verbosity=normal"

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Production build
        run: npm run build
